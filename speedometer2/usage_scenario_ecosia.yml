---
name: Speedometer 2.1 - Ecosia
author: Didi Hoffmann
description: Starts Ecosia idle for 60 s, then runs Speedometer 2.1 in it and reports its score

custom_metrics:
  speedometer_score:
    unit: Speedometer 2.1 score x 100

services:
  bench-service:
    image: ubuntu:26.04
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      DISPLAY: ":0"
      DEBIAN_FRONTEND: noninteractive
    shm_size: 4gb
    setup-commands:
      - command: echo "tzdata tzdata/Areas select Europe" | debconf-set-selections
        shell: /bin/bash
      - command: echo "tzdata tzdata/Zones/Europe select Berlin" | debconf-set-selections
        shell: /bin/bash
      - command: apt update
      - command: apt install -y xxd wget dbus dbus-x11
      - command: mkdir -p /run/dbus
      - command: dbus-daemon --system --fork
      - command: head -c 16 /dev/urandom | xxd -p > /etc/machine-id
        shell: /bin/bash
    networks:
      - benchmark

  speedometer:
    image: speedometer-2-1
    build: .
    container_name: speedometer
    networks:
      - benchmark

flow:
  # Ecosia ships its Linux browser only as a Snap and a Flatpak. The snap is the
  # newer build, but snapd does not run in a container. So the stable snap is
  # downloaded from the Snap Store, pinned to revision 6 (152.0.7977.8), and
  # unpacked with unsquashfs. /opt/ecosia then takes the place of $SNAP. The
  # snap's own launcher sources the gpu-2404 and gnome-platform content snaps,
  # which only snapd mounts, so the chrome binary inside is started directly.
  # The snap points the app at this binary as well, and it needs none of the
  # environment the snap sets. libgtk-3-0t64, libnss3, libasound2t64 and
  # libgbm1 pull in every library the binary links against.
  - name: install
    container: bench-service
    commands:
      - type: console
        command: wget -nv -O /tmp/ecosia.snap https://api.snapcraft.io/api/v1/snaps/download/2MakkUunZD1vJLykl5QmmVDQAZdE84wY_6.snap && apt install -y squashfs-tools libgtk-3-0t64 libnss3 libasound2t64 libgbm1 && unsquashfs -q -no-progress -d /opt/ecosia /tmp/ecosia.snap && rm /tmp/ecosia.snap
        shell: /bin/bash
      - type: console
        command: /opt/ecosia/opt/ecosia/chrome --version
      # Ecosia has HTTPS-First Mode on by default and stops the plain HTTP
      # Speedometer page with a warning. Turning the HTTPS-First features off
      # on the command line only changes how that warning looks. The
      # HttpAllowlist policy exempts the host speedometer and nothing else.
      # Ecosia reads its policies from the Chromium folder /etc/chromium.
      - type: console
        command: install -d /etc/chromium/policies/managed && echo '{"HttpAllowlist":["speedometer"]}' > /etc/chromium/policies/managed/speedometer.json
        shell: /bin/bash

  - name: sleep
    container: bench-service
    commands:
      - type: console
        command: sleep 10

  - name: idle
    container: bench-service
    commands:
      # The browser runs as the unprivileged user ubuntu, uid 1000, because that
      # uid owns the desktop's X socket on the host. As root, the GPU process of
      # Chromium-based browsers drops all capabilities, the 0755 socket refuses
      # it, and the window stays black.
      # timeout only kills the process it started, and Ubuntu 26.04's timeout
      # (uutils) does not kill the process group the way GNU timeout did. A
      # browser whose launcher does not exec it, like Brave's, keeps running.
      # Only the browser runs as ubuntu, so pkill on that user removes whatever
      # is left. It runs in the same command because leftovers hold the output
      # pipe, and Docker would keep the phase open for up to 2 s more.
      - type: console
        command: runuser -u ubuntu -- timeout -s SIGKILL 60 /opt/ecosia/opt/ecosia/chrome --no-sandbox --disable-gpu --no-first-run --no-default-browser-check --disable-sync || true; pkill -KILL -u ubuntu || true
        shell: /bin/bash
        ignore-errors: True

  - name: sleep2
    container: bench-service
    commands:
      - type: console
        command: sleep 10

  # The browser runs as the unprivileged user ubuntu, uid 1000, because that
  # uid owns the desktop's X socket on the host. As root, the GPU process of
  # Chromium-based browsers drops all capabilities, the 0755 socket refuses it,
  # and the window stays black.
  # The run phase starts the browser in the background and then waits on port
  # 9000 of the speedometer container, which only answers once Speedometer has
  # reported its score. So the phase begins before the browser exists and ends
  # when the benchmark is done, and the score becomes the custom metric
  # speedometer_score. Without a score the phase fails. The browser writes into
  # a file, so it does not keep the phase open. close ends it, and the timeout
  # is only a safety net.
  - name: run
    container: bench-service
    commands:
      - type: console
        command: |
          runuser -u ubuntu -- timeout -s SIGKILL 900 /opt/ecosia/opt/ecosia/chrome --no-sandbox --disable-gpu --no-first-run --no-default-browser-check --disable-sync http://speedometer:8080?startAutomatically=true > /tmp/browser.log 2>&1 &
          exec 3<>/dev/tcp/speedometer/9000
          result=$(cat <&3)
          echo "$result"
          grep -q ' speedometer_score=' <<< "$result"
        shell: /bin/bash

  # Closing the browser the way a user does. Everything that runs as ubuntu
  # gets SIGTERM, and that is only the browser. What has not exited after 10 s
  # is killed. The browser's own output follows for the log.
  - name: close
    container: bench-service
    commands:
      - type: console
        command: |
          pkill -TERM -u ubuntu || true
          for i in $(seq 50); do pgrep -u ubuntu > /dev/null || break; sleep 0.2; done
          pkill -KILL -u ubuntu || true
          tail -n 100 /tmp/browser.log || true
        shell: /bin/bash

  - name: sleep3
    container: bench-service
    commands:
      - type: console
        command: sleep 10

  - name: uninstall
    container: bench-service
    commands:
      - type: console
        command: rm -rf /opt/ecosia /etc/chromium
      - type: console
        command: apt purge --auto-remove -y squashfs-tools libgtk-3-0t64 libnss3 libasound2t64 libgbm1

networks:
  benchmark:
