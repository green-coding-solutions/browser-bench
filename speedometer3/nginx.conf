# browser-bench: browser-bench.js reports the end of the benchmark to /bench/,
# and wait-score reads it from this log.
log_format marks '$msec $request_uri';

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Required for accurate performance measurements (SharedArrayBuffer)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Correct MIME type for ES modules
    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js mjs;
        image/png                   png;
        image/svg+xml               svg;
        application/json            json;
        text/plain                  txt;
        application/wasm            wasm;
        font/woff2                  woff2;
        font/woff                   woff;
    }

    location /bench/ {
        access_log /var/log/nginx/marks.log marks;
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
