# The emulated sites. Every request of the session ends here, nothing goes to
# the internet. Static assets are cacheable like on real sites, pages are
# revalidated on every visit.
log_format marks '$msec $request_uri';

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Phase markers from the simulated user. wait-mark reads this log.
    location /mark/ {
        access_log /var/log/nginx/marks.log marks;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # The webmail's send button.
    location = /mail/send {
        add_header Cache-Control "no-store" always;
        return 204;
    }

    location ~* \.(jpg|webm|css|js)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
