---
name: Web usage - Firefox
author: Didi Hoffmann
description: Runs a ten minute desktop browsing session in Firefox against emulated sites, see web-usage/README.md

services:
  bench-service:
    image: ubuntu:26.04
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      DISPLAY: ":0"
      DEBIAN_FRONTEND: noninteractive
    shm_size: 4gb
    docker-run-args:
      - --security-opt seccomp=unconfined
    setup-commands:
      - command: echo "tzdata tzdata/Areas select Europe" | debconf-set-selections
        shell: /bin/bash
      - command: echo "tzdata tzdata/Zones/Europe select Berlin" | debconf-set-selections
        shell: /bin/bash
      - command: apt update
      - command: apt install -y xxd wget
      - command: head -c 16 /dev/urandom | xxd -p > /etc/machine-id
        shell: /bin/bash
      - command: install -d -m 0755 /etc/apt/keyrings
      - command: wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O /etc/apt/keyrings/packages.mozilla.org.asc
      - command: echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" > /etc/apt/sources.list.d/mozilla.list
        shell: /bin/bash
      # Ubuntu's own firefox package only installs the snap. The pin makes apt
      # take Mozilla's deb instead.
      - command: |
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' > /etc/apt/preferences.d/mozilla
        shell: /bin/bash
      - command: apt update
    networks:
      - benchmark

  web:
    image: browser-bench-web
    build: server
    container_name: web
    networks:
      - benchmark

flow:
  - name: install
    container: bench-service
    commands:
      - type: console
        command: apt install -y firefox
      - type: console
        command: dpkg-query -W firefox

  - name: sleep
    container: bench-service
    commands:
      - type: console
        command: sleep 10

  - name: idle
    container: bench-service
    commands:
      # The browser runs as the unprivileged user ubuntu, uid 1000, because that
      # uid owns the desktop's X socket on the host. As root, the GPU process of
      # Chromium-based browsers drops all capabilities, the 0755 socket refuses
      # it, and the window stays black.
      # timeout only kills the process it started, and Ubuntu 26.04's timeout
      # (uutils) does not kill the process group the way GNU timeout did. A
      # browser whose launcher does not exec it, like Brave's, keeps running.
      # Only the browser runs as ubuntu, so pkill on that user removes whatever
      # is left. It runs in the same command because leftovers hold the output
      # pipe, and Docker would keep the phase open for up to 2 s more.
      - type: console
        command: runuser -u ubuntu -- timeout -s SIGKILL 60 firefox -setDefaultBrowser || true; pkill -KILL -u ubuntu || true
        shell: /bin/bash
        ignore-errors: True

  - name: sleep2
    container: bench-service
    commands:
      - type: console
        command: sleep 10

  # The browser runs as the unprivileged user ubuntu, uid 1000, because that
  # uid owns the desktop's X socket on the host. As root, the GPU process of
  # Chromium-based browsers drops all capabilities, the 0755 socket refuses it,
  # and the window stays black.
  # The startup phase starts the session browser in the background. The first
  # address is the tab of the simulated user, the second one stays open in a
  # background tab, so two tabs are open, as on average in Weinreich et al.
  # 2008. Then it waits on port 9000 of the web container, which only answers
  # once the start page reports that it is ready. So the phase begins before
  # the browser exists and ends when it shows the start page. The browser keeps
  # running through the session phases and writes into a file, so it does not
  # keep a phase open. close ends it, and the timeout is only a safety net.
  - name: startup
    container: bench-service
    commands:
      - type: console
        command: |
          runuser -u ubuntu -- timeout -s SIGKILL 1200 firefox -setDefaultBrowser "http://web/start/?session=1" http://web/news/ > /tmp/browser.log 2>&1 &
          exec 3<>/dev/tcp/web/9000
          echo ready >&3
          result=$(cat <&3)
          echo "$result"
          [ "$result" = "reached ready" ]
        shell: /bin/bash

  # Each session phase after startup waits in the web container until the
  # simulated user reports the end of that part of the session. The phases,
  # their lengths and their sources are in web-usage/README.md. A mark that does
  # not come in time, or an error the simulated user reports, fails the run.
  - name: search-news
    container: web
    commands:
      - type: console
        command: wait-mark search-news 120

  - name: news
    container: web
    commands:
      - type: console
        command: wait-mark news 180

  - name: search-lookup-1
    container: web
    commands:
      - type: console
        command: wait-mark search-lookup-1 120

  - name: search-shop
    container: web
    commands:
      - type: console
        command: wait-mark search-shop 120

  - name: shop
    container: web
    commands:
      - type: console
        command: wait-mark shop 240

  - name: social
    container: web
    commands:
      - type: console
        command: wait-mark social 240

  - name: mail
    container: web
    commands:
      - type: console
        command: wait-mark mail 240

  - name: search-lookup-2
    container: web
    commands:
      - type: console
        command: wait-mark search-lookup-2 120

  - name: search-reference
    container: web
    commands:
      - type: console
        command: wait-mark search-reference 120

  - name: reference
    container: web
    commands:
      - type: console
        command: wait-mark reference 400

  - name: video
    container: web
    commands:
      - type: console
        command: wait-mark video 400

  # Closing the browser the way a user does. Everything that runs as ubuntu
  # gets SIGTERM, and that is only the browser. What has not exited after 10 s
  # is killed. The browser's own output follows for the log.
  - name: close
    container: bench-service
    commands:
      - type: console
        command: |
          pkill -TERM -u ubuntu || true
          for i in $(seq 50); do pgrep -u ubuntu > /dev/null || break; sleep 0.2; done
          pkill -KILL -u ubuntu || true
          tail -n 100 /tmp/browser.log || true
        shell: /bin/bash

  - name: sleep3
    container: bench-service
    commands:
      - type: console
        command: sleep 10

  - name: uninstall
    container: bench-service
    commands:
      - type: console
        command: apt purge --auto-remove -y firefox

networks:
  benchmark:
